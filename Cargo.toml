[package]
name = "pregresql"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A mostly-transparent PostgreSQL wire-protocol proxy with pluggable authentication and query policy hooks"
license = "Apache-2.0"
repository = "https://github.com/OffworldNexus/pregresql"
keywords = ["postgresql", "proxy", "protocol", "scram", "database"]
categories = ["database", "network-programming"]
publish = false

[lib]
name = "pregresql"
path = "src/lib.rs"

[[bin]]
name = "pregresql-proxy"
path = "src/bin/pregresql-proxy/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
stringprep = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-postgres = "0.7"

[profile.release]
lto = "thin"
